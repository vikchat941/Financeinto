<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Auto insurance cost estimator based on car age and driver age.">
  <title>Auto Insurance Cost Estimator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-wrapper">
    <header>
      <div class="container header-content">
        <h1>Auto Insurance Cost Estimator</h1>
      </div>
    </header>

    <main>
      <div class="container">
        <section class="calculator-container" aria-labelledby="insurance-estimator-title">
          <h2 id="insurance-estimator-title">Estimate Your Premium</h2>
          <p class="description">Select your vehicle and driver details to estimate monthly and annual insurance premiums.</p>

          <form id="insurance-form" novalidate>
            <div class="form-row">
              <div class="form-group">
                <label for="carType">Car Type</label>
                <select id="carType" name="carType" required>
                  <option value="" selected disabled>Select car type</option>
                  <option value="sedan">Sedan</option>
                  <option value="suv">SUV</option>
                  <option value="luxury">Luxury</option>
                </select>
              </div>

              <div class="form-group">
                <label for="carAge">Car Age</label>
                <select id="carAge" name="carAge" required>
                  <option value="" selected disabled>Select car age</option>
                  <option value="brand-new">Brand New</option>
                  <option value="1-3-years">1-3 Years</option>
                  <option value="3-5-years">3-5 Years</option>
                  <option value="5-plus-years">5+ Years</option>
                </select>
              </div>

              <div class="form-group">
                <label for="driverAge">Driver Age</label>
                <input type="number" id="driverAge" name="driverAge" min="16" step="1" placeholder="e.g. 30" required>
              </div>
            </div>

            <button type="button" id="estimatePremium">Estimate Premium</button>
          </form>

          <section class="result" id="insurance-results" aria-live="polite" aria-atomic="true">
            <h3>Premium Estimate</h3>
            <p><strong>Estimated Monthly Premium:</strong> <span id="estimatedMonthlyPremium">$0.00</span></p>
            <p><strong>Estimated Annual Premium:</strong> <span id="estimatedAnnualPremium">$0.00</span></p>
          </section>
        </section>
      </div>
    </main>

    <footer>
      <div class="container footer-content">
        <section class="footer-articles" aria-label="Additional insurance resources"></section>
      </div>
    </footer>
  </div>

  <script src="insurance.js" defer></script>
</body>
</html>
